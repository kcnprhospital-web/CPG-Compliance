<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCPH CPG Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#16233B; --muted:#5B6B7A; --paper:#EEF3F5; --surface:#FFFFFF; --line:#D3DDE3;
  --teal:#0E6E6B; --teal-soft:#DCEFEC; --ok:#1B7F4B; --warn:#A86200; --flag:#B3261E; --flag-soft:#FBE9E7;
  --r:10px;
  font-family:"Kantumruy Pro","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); background:var(--paper);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #6FB7B3;outline-offset:2px}

/* header */
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:contain}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:1.15rem;font-weight:700;line-height:1.25}
.brand p{margin:0;font-size:.8rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;font-size:.85rem}
.hbtn:hover{background:rgba(255,255,255,.12)}

.notice{background:var(--flag-soft);color:#6E1A14;font-size:.85rem;padding:6px 16px;border-bottom:1px solid #F2CFCB}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:600}
.toolbar select{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:.9rem}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:600;font-size:.9rem;padding:6px 4px}

/* thread */
main{flex:1;overflow-y:auto}
.thread{max-width:820px;margin:0 auto;padding:18px 16px 8px}
.empty{padding:28px 4px}
.empty h2{font-size:1.35rem;line-height:1.35;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 18px;max-width:60ch}
.examples{display:flex;flex-direction:column;gap:8px}
.examples button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.examples button:hover{border-color:var(--teal)}

.msg{margin:0 0 16px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--teal);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:85%;white-space:pre-wrap}
.msg.user .tag{font-size:.75rem;opacity:.8;display:block}
.answer{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:4px 14px 14px 14px;padding:12px 16px}
.answer.err{border-left-color:var(--flag)}
.answer h4{margin:12px 0 4px;font-size:1rem}
.answer p{margin:6px 0}
.answer ul,.answer ol{margin:6px 0;padding-left:22px}
.answer strong{font-weight:700}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin:0 1px;border:0;border-radius:4px;background:var(--teal-soft);color:var(--teal);font-size:.72rem;font-weight:700;vertical-align:2px}
.cite:hover{background:var(--teal);color:#fff}
.thinking{color:var(--muted);font-style:normal}
.thinking::after{content:"";display:inline-block;width:1.2em;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"..."}}

/* sources as guideline index tabs */
.sources{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.sources > span{font-size:.8rem;color:var(--muted);font-weight:600}
.src{margin:6px 0;border:1px solid var(--line);border-radius:0 8px 8px 0;background:#FAFCFC}
.src summary{list-style:none;display:flex;align-items:center;gap:10px;padding:6px 10px 6px 0;cursor:pointer;font-size:.88rem}
.src summary::-webkit-details-marker{display:none}
.src .tab{background:var(--teal);color:#fff;font-weight:700;min-width:30px;align-self:stretch;display:flex;align-items:center;justify-content:center;margin:-6px 0;border-radius:0 6px 6px 0}
.src .doc{flex:1;min-width:0}
.src .pg{color:var(--muted);white-space:nowrap}
.src[open]{border-color:var(--teal)}
.src .excerpt{padding:8px 12px 10px 40px;font-size:.85rem;white-space:pre-wrap;color:#33424F;max-height:260px;overflow:auto;border-top:1px solid var(--line)}
.src.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--teal-soft)}100%{background:#FAFCFC}}

.actions{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 9px}
.actions button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal)}

/* composer */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px}
.composer .inner{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:46px;max-height:180px;background:#fff;line-height:1.5}
.composer textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.send{background:var(--teal);color:#fff;border:0;border-radius:var(--r);padding:0 18px;height:46px;font-weight:600}
.send:disabled{opacity:.5;cursor:not-allowed}

/* admin */
.admin{max-width:900px;margin:0 auto;padding:18px 16px 40px;display:none}
.admin.on{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.panel h2{font-size:1.1rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--muted)}
label input,label select{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--flag);border:1px solid #E7B9B4}
.btn:disabled{opacity:.5}
.progress{height:10px;background:var(--paper);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.progress div{height:100%;width:0;background:var(--teal);transition:width .3s}
.plog{font-size:.82rem;color:var(--muted);max-height:160px;overflow:auto;white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.ready{background:#DDF1E5;color:var(--ok)}
.pill.indexing{background:#FCEFD9;color:var(--warn)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.stats b{display:block;font-size:1.6rem;line-height:1.1}
.stats span{font-size:.82rem;color:var(--muted)}
.hide{display:none!important}
@media (max-width:560px){.brand p{display:none}.seg button{padding:6px 10px;font-size:.85rem}}
</style>
</head>
<body>

<header>
  <img id="logo" src="logo.png" alt="KCPH" onerror="this.style.display='none'">
  <div class="brand">
    <h1 data-i="title"></h1>
    <p data-i="sub"></p>
  </div>
  <button class="hbtn" id="langBtn" type="button">EN</button>
  <button class="hbtn" id="adminBtn" type="button" data-i="admin"></button>
</header>
<div class="notice" data-i="notice"></div>

<!-- ============ CHAT VIEW ============ -->
<section id="chatView" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="toolbar">
    <div class="seg" role="group">
      <button type="button" id="mConsult" aria-pressed="true" data-i="modeConsult"></button>
      <button type="button" id="mCheck" aria-pressed="false" data-i="modeCheck"></button>
    </div>
    <select id="scope" aria-label="Guideline"></select>
    <button class="linkbtn" id="newChat" type="button" data-i="newChat"></button>
  </div>
  <main id="scroller">
    <div class="thread" id="thread"></div>
  </main>
  <div class="composer">
    <div class="inner">
      <textarea id="input" rows="1"></textarea>
      <button class="send" id="sendBtn" type="button" data-i="send"></button>
    </div>
  </div>
</section>

<!-- ============ ADMIN VIEW ============ -->
<main id="adminView" class="admin">
  <div class="panel" id="loginPanel">
    <h2 data-i="adminLogin"></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="pw" type="password" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 10px" autocomplete="current-password">
      <button class="btn" id="loginBtn" type="button" data-i="signIn"></button>
    </div>
    <p id="loginMsg" style="color:var(--flag);margin:8px 0 0"></p>
  </div>

  <div id="adminBody" class="hide">
    <div class="panel">
      <h2 data-i="upTitle"></h2>
      <p style="margin:0 0 12px;color:var(--muted);font-size:.9rem" data-i="upHelp"></p>
      <div class="grid">
        <label><span data-i="upFile"></span><input id="upFile" type="file" accept="application/pdf"></label>
        <label><span data-i="upName"></span><input id="upName" type="text"></label>
        <label><span data-i="upDept"></span>
          <select id="upDept">
            <option>Medicine</option><option>Emergency / ICU</option><option>Surgery</option>
            <option>Pediatrics</option><option>OB/GYN</option><option>Dentistry</option>
            <option>KCPH local protocol</option><option>Other</option>
          </select></label>
        <label><span data-i="upEdition"></span><input id="upEdition" type="text" value="December 2025"></label>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="upStart" type="button" data-i="upStart"></button>
        <button class="btn ghost hide" id="upStop" type="button" data-i="upStop"></button>
      </div>
      <div class="progress"><div id="upBar"></div></div>
      <div class="plog" id="upLog"></div>
    </div>

    <div class="panel">
      <h2 data-i="docsTitle"></h2>
      <div class="tablewrap"><table>
        <thead><tr><th data-i="thName"></th><th data-i="thDept"></th><th data-i="thPages"></th><th data-i="thStatus"></th><th></th></tr></thead>
        <tbody id="docsBody"></tbody>
      </table></div>
    </div>

    <div class="panel">
      <h2 data-i="useTitle"></h2>
      <div class="stats" id="stats"></div>
      <div class="tablewrap"><table>
        <thead><tr><th data-i="thTime"></th><th data-i="thQ"></th><th data-i="thSrc"></th><th data-i="thFb"></th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table></div>
      <button class="btn ghost" id="refreshStats" type="button" style="margin-top:10px" data-i="refresh"></button>
    </div>
  </div>
</main>

<script>
/* ================= CONFIG ================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz2f0Gnhi33sN6IBcEBOmuOpNF46aBKsPoSiSQGa7MkabIwPupgMweOZOUkfkf-KTmd/exec';

function configured(){ return GAS_URL && GAS_URL.startsWith('https://'); }

async function post(body){
  if(!configured()) throw new Error(t('errCfg'));
  let r;
  try{
    r = await fetch(GAS_URL, { method:'POST', body: JSON.stringify(body) }); // text/plain: no preflight
  }catch(e){ throw new Error(t('errNet')); }
  const raw = await r.text();
  let j;
  try{ j = JSON.parse(raw); }
  catch(e){ throw new Error(t('errServer')); }   // Google returned an error web page (timeout / hiccup)
  if(!j.ok) throw new Error(j.error || 'Error');
  return j;
}

function jsonp(params){
  return new Promise((resolve, reject) => {
    if(!configured()) return reject(new Error(t('errCfg')));
    const cb = 'cb' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error(t('errNet'))); }, 30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); data.ok ? resolve(data) : reject(new Error(data.error)); };
    s.onerror = () => { cleanup(); reject(new Error(t('errNet'))); };
    s.src = GAS_URL + '?' + new URLSearchParams({ ...params, callback: cb });
    document.body.appendChild(s);
  });
}

function md(src){
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([\d,\s]+)\]/g, (m, g) => g.split(/[,\s]+/).filter(Boolean)
      .map(n => `<button type="button" class="cite" data-n="${n}">${n}</button>`).join(''));
  const lines = esc(src).split('\n');
  let html = '', list = null;
  const close = () => { if(list){ html += `</${list}>`; list = null; } };
  for(const raw of lines){
    const line = raw.trimEnd();
    let m;
    if(!line.trim()){ close(); continue; }
    if((m = line.match(/^#{1,4}\s+(.*)/))){ close(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if((m = line.match(/^\s*[-*•]\s+(.*)/))){ if(list !== 'ul'){ close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ if(list !== 'ol'){ close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    close(); html += `<p>${inline(line)}</p>`;
  }
  close();
  return html;
}

    try{ await navigator.clipboard.writeText(txt); e.target.textContent = t('copied'); }catch(_){}
  };
}

async function renderPage(pdf, n){
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale:1 });
  const scale = Math.min(2.2, 1400 / base.width);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  return c.toDataURL('image/jpeg', 0.82).split(',')[1];
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
// Read a page's own text layer. Accept it only when it is clearly clean English
// (Khmer text layers are often garbled, so Khmer/mixed/scanned pages go to the AI).
const EN_COMMON = /\b(the|and|of|to|in|with|for|or|is|are|be|if|at|by|mg|kg|ml|iv|im|po|patients?|treatment|dose|daily|hours?|days?|weeks?|months?|years?|children|child|adults?|blood|mmhg|signs?|severe|mild|moderate|diagnosis|management|tablets?|injection|infusion|every|max|minutes?|age)\b/gi;

// Layout-aware text: rebuilds lines from word positions and separates table columns with " | "
async function pageText(pdf, n, raw){
  const page = await pdf.getPage(n);
  const tc = await page.getTextContent();
  const items = tc.items.filter(it => it.str && it.str.trim() && it.transform).map(it => ({
    s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0,
    h: Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 10
  }));
  if(!items.length) return raw ? '' : null;
  items.sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const lines = [];
  for(const it of items){
    const line = lines[lines.length - 1];
    if(line && Math.abs(line.y - it.y) <= Math.max(2, 0.5 * Math.min(line.h, it.h))) line.items.push(it);
    else lines.push({ y: it.y, h: it.h, items: [it] });
  }
  let text = '', prevY = null, prevH = 10, tableLines = 0;
  for(const line of lines){
    line.items.sort((a, b) => a.x - b.x);
    let str = '', prev = null;
    for(const it of line.items){
      if(prev){
        const gap = it.x - (prev.x + prev.w);
        const charW = prev.w / Math.max(1, prev.s.length) || 5;
        if(gap > Math.max(12, 2.5 * charW)) str += ' | ';
        else if(gap > 0.8 && !/\s$/.test(str) && !/^\s/.test(it.s)) str += ' ';
      }
      str += it.s;
      prev = it;
    }
    str = str.replace(/[ \t]+/g, ' ').trim();
    if(!str) continue;
    if(str.includes(' | ')) tableLines++;
    if(prevY !== null && prevY - line.y > 1.8 * Math.max(prevH, line.h)) text += '\n';
    text += (text ? '\n' : '') + str;
    prevY = line.y; prevH = line.h;
  }
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  if(raw) return text;
  if(/[\u1780-\u17FF\u19E0-\u19FF]/.test(text)) return null;       // contains Khmer: needs the AI
  const words = text.split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  const common = (text.match(EN_COMMON) || []).length;
  const letters = (text.match(/[A-Za-z]/g) || []).length;
  const vowels = (text.match(/[aeiouyAEIOUY]/g) || []).length;
  const vowelOK = letters > 0 && vowels / letters > 0.25 && vowels / letters < 0.6;   // rejects garbled legacy-font text
  const wordlike = words.filter(w => /^[(\[]?([A-Za-z][A-Za-z'’\-]*|[A-Za-z]?\d+([.,/–\-:]\d+)*[A-Za-z%µ/]*|[<>≥≤=+–\-]+|\||•)[)\].,;:]?$/.test(w)).length / words.length;
  // ordinary English prose
  if(text.length >= 300 && common >= 8 && common / words.length >= 0.08 && vowelOK) return text;
  // tables: fewer common words, but clean words, numbers and units in columns
  if(tableLines >= 3 && text.length >= 150 && common >= 3 && wordlike >= 0.75 && vowelOK) return text;
  return null;                                                      // scanned, garbled or unclear: needs the AI
}

async function postRetry(body, tries = 5){
  for(let i = 0; i < tries; i++){
    try{ return await post(body); }
    catch(e){
      const msg = String(e.message);
      if(msg.startsWith('DAILY_QUOTA') || i === tries - 1 || stopFlag) throw e;
      const rate = msg.startsWith('RATE_LIMIT');
      plog(rate ? '  Waiting 1 minute (free per-minute limit)…' : '  retry: ' + msg);
      await sleep(rate ? WAIT_AFTER_RATE_LIMIT : 20000);
    }
  }
}

async function startUpload(){
  const file = $('upFile').files[0];
  const name = $('upName').value.trim();
  if(!file || !name){ plog('Choose a PDF and enter a document name.'); return; }
  if(!window.pdfjsLib){ plog('PDF reader failed to load. Check the internet connection.'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  stopFlag = false;
  $('upStart').disabled = true; $('upStop').classList.remove('hide'); $('upLog').textContent = '';
  try{
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const total = pdf.numPages;
    plog(`${name}: ${total} pages`);
    const c = await post({ action:'createDoc', password:adminPw, name, department:$('upDept').value, edition:$('upEdition').value, pages:total });
    const done = new Set((await post({ action:'docPages', password:adminPw, docId:c.docId })).pages);
    if(c.resumed) plog(`Resuming: ${done.size} pages already stored`);
    const todo = [];
    for(let p = 1; p <= total; p++) if(!done.has(p)) todo.push(p);
    let count = done.size;
    $('upBar').style.width = (count / total * 100) + '%';
    let freePages = 0, aiPages = 0, idx = 0;
    let fatal = null;
    const running = new Set();
    // One batch: send it, then read any blocked pages one by one
    async function processBatch(pages, imgs){
      const r = await postRetry({ action:'indexPages', password:adminPw, docId:c.docId, docName:name, pages });
      const blocked = r.blocked || [];
      const unread = (r.unreadable || []).slice();
      if(blocked.length){
        const why = r.blockedReason === 'quota' ? 'page-reading quota used up, using the backup model (slower)'
                  : r.blockedReason === 'empty' ? 'AI returned no text' : 'AI filter blocked them';
        plog(`Pages ${pages[0].page}–${pages[pages.length-1].page}: ${why}; reading page(s) ${blocked.join(', ')} one by one…`);
        for(const n of blocked){
          if(stopFlag || fatal) return;
          const item = pages.find(x => x.page === n);
          const r1 = await postRetry({ action:'indexPages', password:adminPw, docId:c.docId, docName:name, pages:[item], fallback:true });
          if(r1.unreadable && r1.unreadable.length) unread.push(...r1.unreadable);
          else plog(`  Page ${n} stored (fallback)`);
        }
      } else {
        plog(`Pages ${pages[0].page}–${pages[pages.length-1].page} stored (${r.chunks ?? 0} sections; ${imgs ? imgs + ' read by AI' : 'text only, no AI'}${r.pending ? '; search index later' : ''})`);
      }
      count += pages.length; aiPages += imgs; freePages += pages.length - imgs;
      $('upBar').style.width = (count / total * 100) + '%';
      if(unread.length) plog(`  ⚠️ Could not read page(s) ${unread.join(', ')}. Check them in the PDF.`);
    }
    while(idx < todo.length && !stopFlag && !fatal){
      const pages = [];
      let imgs = 0;
      while(idx < todo.length && imgs < PAGES_PER_BATCH && pages.length < TEXT_PAGES_PER_BATCH){
        const p = todo[idx++];
        const txt = await pageText(pdf, p);
        if(txt) pages.push({ page:p, text:txt });
        else { pages.push({ page:p, image: await renderPage(pdf, p), layer: (await pageText(pdf, p, true)).slice(0, 20000) }); imgs++; }
      }
      const task = processBatch(pages, imgs)
        .catch(e => { if(!fatal) fatal = e; })
        .finally(() => running.delete(task));
      running.add(task);
      if(running.size >= PARALLEL_BATCHES) await Promise.race(running);
      else await sleep(STAGGER_MS);
    }
    await Promise.all(running);
    if(fatal) throw fatal;
    if(stopFlag) plog('Paused. Choose the same file and name to continue.');
    plog(`This session: ${freePages} pages read directly (free), ${aiPages} pages read by AI.`);
    if(!stopFlag){
      const f = await post({ action:'finishDoc', password:adminPw, docId:c.docId, pages:total });
      plog(`Done. ${f.chunks} sections searchable.`);
    }
  }catch(e){
    plog('Stopped: ' + String(e.message).replace(/^(DAILY_QUOTA|RATE_LIMIT): /, '') + '\nChoose the same file and name to continue.');
  }
  $('upStart').disabled = false; $('upStop').classList.add('hide');
  loadDocs();
}

/* ================= WIRING ================= */
$('langBtn').onclick = () => { lang = lang === 'km' ? 'en' : 'km'; try{ localStorage.setItem('cpg_lang', lang); }catch(e){} applyLang(); };
$('adminBtn').onclick = toggleAdmin;
$('mConsult').onclick = () => setMode('consult');
$('mCheck').onclick = () => setMode('check');
$('newChat').onclick = () => { history = []; renderEmpty(); };
$('sendBtn').onclick = send;
$('input').addEventListener('input', autosize);
$('input').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:700px)').matches){ e.preventDefault(); send(); } });
$('loginBtn').onclick = () => login($('pw').value, false);
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') login($('pw').value, false); });
$('upFile').onchange = () => { const f = $('upFile').files[0]; if(f && !$('upName').value) $('upName').value = f.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' '); };
$('upStart').onclick = startUpload;
$('upStop').onclick = () => { stopFlag = true; };
$('refreshStats').onclick = loadStats;

applyLang();
loadDocs();
</script>
</body>
</html>
