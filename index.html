<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCPH CPG Assistant</title>
<meta name="author" content="Dr. Yeap Kong, Technical Office, Kampong Chhnang Provincial Hospital">
<meta name="description" content="Clinical practice guideline assistant for physicians at Kampong Chhnang Provincial Hospital. Created by Dr. Yeap Kong.">
<meta name="theme-color" content="#12233A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#12233A; --muted:#5A6B7C; --bg:#F2F5F5; --surface:#FFFFFF; --sunk:#E9EFEF; --line:#D9E2E4;
  --teal:#0B6E69; --teal-2:#08585A; --teal-soft:#E0F0EE; --navy:#12233A;
  --ok:#17804A; --ok-soft:#E2F3E9; --warn:#9A5800; --warn-soft:#FBEFD9; --flag:#B42318; --flag-soft:#FCEBE8;
  --r-sm:8px; --r:12px; --r-lg:18px;
  font-family:"Kantumruy Pro","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); background:var(--bg);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E4ECF1; --muted:#9FB0BE; --bg:#0E1620; --surface:#16212D; --sunk:#1C2937; --line:#2A3A4B;
    --teal:#3FB4AC; --teal-2:#5CC7BF; --teal-soft:#153338; --navy:#0B1622;
    --ok:#6CCB94; --ok-soft:#163224; --warn:#EDB25D; --warn-soft:#352914; --flag:#F08A80; --flag-soft:#3A1E1B;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 55%,transparent);outline-offset:2px}
.hide{display:none!important}

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.mark{width:38px;height:38px;flex:none}
header img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:1.08rem;font-weight:700;line-height:1.25;letter-spacing:.01em}
.brand p{margin:0;font-size:.78rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 12px;font-size:.84rem}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn svg{width:16px;height:16px}
.notice{background:var(--flag-soft);color:var(--flag);font-size:.82rem;padding:6px 16px;display:flex;gap:8px;align-items:center}
.notice::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* ---------- chat toolbar ---------- */
.toolbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.toolbar .row{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:.88rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--teal);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linkbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem;padding:5px 12px;border-radius:999px}
.linkbtn:hover{border-color:var(--teal);color:var(--teal)}
.linkbtn svg{width:15px;height:15px}
.chips{max-width:860px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.82rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.chip:hover:not([aria-pressed="true"]){border-color:var(--teal);color:var(--teal)}
#scope{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- thread ---------- */
#scroller{flex:1;overflow-y:auto}
.thread{max-width:860px;margin:0 auto;padding:20px 16px 12px}
.empty{padding:22px 2px 8px}
.empty h2{font-size:1.5rem;line-height:1.3;margin:0 0 10px;font-weight:700;max-width:26ch}
.empty p{color:var(--muted);margin:0 0 20px;max-width:62ch}
.examples{display:grid;gap:8px}
.examples button{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--r-sm);padding:10px 14px;line-height:1.45}
.examples button:hover{background:var(--teal-soft)}
.msg{margin:0 0 18px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--teal);color:#fff;border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);padding:10px 15px;max-width:85%;white-space:pre-wrap;line-height:1.5}
.msg.user .tag{font-size:.74rem;opacity:.85;display:block;margin-bottom:2px}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:4px var(--r-lg) var(--r-lg) var(--r-lg);padding:14px 18px;box-shadow:0 1px 0 rgba(18,35,58,.04)}
.answer.err{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.answer h4{margin:14px 0 4px;font-size:1rem}
.answer h4:first-child{margin-top:0}
.answer p{margin:6px 0}
.answer ul,.answer ol{margin:6px 0;padding-left:22px}
.answer li{margin:3px 0}
.answer strong{font-weight:700}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin:0 1px;border:0;border-radius:5px;background:var(--teal-soft);color:var(--teal);font-size:.72rem;font-weight:700;vertical-align:2px}
.cite:hover{background:var(--teal);color:#fff}
.pending{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--teal);opacity:.3;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.secs{font-variant-numeric:tabular-nums;font-size:.85rem;margin-left:auto}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}

/* sources: index tabs */
.sources{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.sources > span{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.src{margin:6px 0;border:1px solid var(--line);border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--surface);overflow:hidden}
.src summary{list-style:none;display:flex;align-items:stretch;gap:10px;cursor:pointer;font-size:.86rem}
.src summary::-webkit-details-marker{display:none}
.src .tab{background:var(--teal);color:#fff;font-weight:700;min-width:32px;display:flex;align-items:center;justify-content:center}
.src .doc{flex:1;min-width:0;padding:7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .pg{color:var(--muted);white-space:nowrap;padding:7px 12px 7px 0}
.src[open]{border-color:var(--teal)}
.src .excerpt{padding:10px 14px 12px 44px;font-size:.84rem;white-space:pre-wrap;color:var(--muted);max-height:280px;overflow:auto;border-top:1px solid var(--line);background:var(--sunk)}
.src.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--teal-soft)}100%{background:var(--surface)}}
.actions{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px}
.actions button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal)}
.actions .meta{margin-left:auto}

/* ---------- composer ---------- */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px 6px}
.composer .inner{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--sunk);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 16px}
.composer .inner:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.composer textarea{flex:1;resize:none;border:0;background:transparent;padding:7px 0;min-height:38px;max-height:180px;line-height:1.5;outline:none}
.send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center}
.send:hover{background:var(--teal-2)}
.send:disabled{opacity:.45;cursor:not-allowed}
.send svg{width:18px;height:18px}
.credit{max-width:860px;margin:6px auto 0;text-align:center;font-size:.72rem;color:var(--muted)}

/* ---------- admin ---------- */
.admin{max-width:960px;margin:0 auto;padding:18px 16px 40px;display:none;width:100%;overflow-y:auto}
.admin.on{display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.panel h2{font-size:1.1rem;margin:0 0 8px}
.panel > p{margin:0 0 14px;color:var(--muted);font-size:.9rem;max-width:75ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:.84rem;color:var(--muted)}
label input,label select,#pw{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface);color:var(--ink)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:var(--r-sm);padding:9px 16px;font-weight:600}
.btn:hover{background:var(--teal-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--flag);border:1px solid color-mix(in srgb,var(--flag) 35%,transparent)}
.btn:disabled{opacity:.5}
.btnrow{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.progress{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:14px 0 8px}
.progress div{height:100%;width:0;background:var(--teal);transition:width .3s}
.plog{font-size:.8rem;color:var(--muted);max-height:220px;overflow:auto;white-space:pre-wrap;background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px}
.plog:empty{display:none}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.76rem;font-weight:600}
.pill.ready{background:var(--ok-soft);color:var(--ok)}
.pill.indexing{background:var(--warn-soft);color:var(--warn)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:12px}
.stats b{display:block;font-size:1.7rem;line-height:1.1}
.stats span{font-size:.8rem;color:var(--muted)}
.admin .credit{margin-top:20px}
@media (max-width:560px){
  .brand p{display:none}
  .hbtn span{display:none}
  .linkbtn span{display:none}
  .linkbtn{padding:6px 9px}
  .toolbar .row{flex-wrap:nowrap}
  .seg button{padding:6px 11px;font-size:.84rem}
  .empty h2{font-size:1.28rem}
}
</style>
</head>
<body>

<header>
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <rect x="3" y="4" width="28" height="32" rx="4" fill="#fff"/>
    <rect x="31" y="9" width="6" height="8" rx="2" fill="#3FB4AC"/>
    <rect x="31" y="19" width="6" height="8" rx="2" fill="#E0F0EE"/>
    <path d="M10 14h14M10 20h14M10 26h9" stroke="#12233A" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <img id="logo" src="logo.png" alt="KCPH" onload="var m=document.querySelector('.mark');if(m)m.remove()" onerror="this.remove()">
  <div class="brand">
    <h1 data-i="title"></h1>
    <p data-i="sub"></p>
  </div>
  <button class="hbtn" id="langBtn" type="button">EN</button>
  <button class="hbtn" id="adminBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span id="adminLabel"></span>
  </button>
</header>
<div class="notice" data-i="notice"></div>

<!-- ============ CHAT VIEW ============ -->
<section id="chatView" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="toolbar">
    <div class="row">
      <div class="seg" role="group">
        <button type="button" id="mConsult" aria-pressed="true" data-i="modeConsult"></button>
        <button type="button" id="mCheck" aria-pressed="false" data-i="modeCheck"></button>
      </div>
      <button class="linkbtn" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i="newChat"></span>
      </button>
    </div>
    <div class="chips" id="scopeChips" role="group" aria-label="Guideline"></div>
    <select id="scope" aria-hidden="true" tabindex="-1"></select>
  </div>
  <main id="scroller">
    <div class="thread" id="thread"></div>
  </main>
  <div class="composer">
    <div class="inner">
      <textarea id="input" rows="1"></textarea>
      <button class="send" id="sendBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p class="credit" data-i="credit"></p>
  </div>
</section>

<!-- ============ ADMIN VIEW ============ -->
<main id="adminView" class="admin">
  <div class="panel" id="loginPanel">
    <h2 data-i="adminLogin"></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="pw" type="password" style="flex:1;min-width:200px;margin-top:0" autocomplete="current-password">
      <button class="btn" id="loginBtn" type="button" data-i="signIn"></button>
    </div>
    <p id="loginMsg" style="color:var(--flag);margin:8px 0 0"></p>
  </div>

  <div id="adminBody" class="hide">
    <nav class="tabs" id="adminTabs" role="tablist">
      <button type="button" role="tab" data-tab="upload" aria-selected="true" data-i="tabUpload"></button>
      <button type="button" role="tab" data-tab="check" aria-selected="false" data-i="tabCheck"></button>
      <button type="button" role="tab" data-tab="docs" aria-selected="false" data-i="tabDocs"></button>
      <button type="button" role="tab" data-tab="usage" aria-selected="false" data-i="tabUsage"></button>
    </nav>
    <div class="panel" data-panel="upload">
      <h2 data-i="upTitle"></h2>
      <p data-i="upHelp"></p>
      <div class="grid">
        <label><span data-i="upFile"></span><input id="upFile" type="file" accept="application/pdf"></label>
        <label><span data-i="upName"></span><input id="upName" type="text"></label>
        <label><span data-i="upDept"></span>
          <select id="upDept">
            <option>Medicine</option><option>Emergency / ICU</option><option>Surgery</option>
            <option>Pediatrics</option><option>OB/GYN</option><option>Dentistry</option>
            <option>KCPH local protocol</option><option>Other</option>
          </select></label>
        <label><span data-i="upEdition"></span><input id="upEdition" type="text" value="December 2025"></label>
      </div>
      <div class="btnrow">
        <button class="btn" id="upStart" type="button" data-i="upStart"></button>
        <button class="btn ghost hide" id="upStop" type="button" data-i="upStop"></button>
      </div>
      <div class="progress"><div id="upBar"></div></div>
      <div class="plog" id="upLog"></div>
    </div>

    <div class="panel hide" data-panel="check">
      <h2>Check &amp; re-read pages / ពិនិត្យ និងអានទំព័រឡើងវិញ</h2>
      <p>Compares every stored page with the original PDF and lists pages that look wrong.
        Choose the guideline and the same PDF file used for the upload, then run the check. Select pages and re-read them.</p>
      <div class="grid">
        <label>Guideline<select id="chkDoc"></select></label>
        <label>PDF file<input id="chkFile" type="file" accept="application/pdf"></label>
      </div>
      <div class="btnrow">
        <button class="btn" id="chkRun" type="button">Check all pages</button>
        <button class="btn hide" id="chkReread" type="button">Re-read selected pages</button>
        <button class="btn ghost hide" id="chkStop" type="button">Stop</button>
      </div>
      <div class="progress"><div id="chkBar"></div></div>
      <div class="plog" id="chkLog"></div>
      <div class="tablewrap" style="margin-top:10px"><table>
        <thead><tr><th></th><th>Page</th><th>Read by</th><th>Issue</th><th>Stored text</th></tr></thead>
        <tbody id="chkBody"></tbody>
      </table></div>
    </div>

    <div class="panel hide" data-panel="docs">
      <h2 data-i="docsTitle"></h2>
      <div class="tablewrap"><table>
        <thead><tr><th data-i="thName"></th><th data-i="thDept"></th><th data-i="thPages"></th><th data-i="thStatus"></th><th></th></tr></thead>
        <tbody id="docsBody"></tbody>
      </table></div>
    </div>

    <div class="panel hide" data-panel="usage">
      <h2 data-i="useTitle"></h2>
      <div class="stats" id="stats"></div>
      <div class="tablewrap"><table>
        <thead><tr><th data-i="thTime"></th><th data-i="thQ"></th><th data-i="thSrc"></th><th data-i="thFb"></th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table></div>
      <button class="btn ghost" id="refreshStats" type="button" style="margin-top:10px" data-i="refresh"></button>
    </div>
  </div>
  <p class="credit" data-i="credit"></p>
</main>

<script>
/* ================= CONFIG ================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz2f0Gnhi33sN6IBcEBOmuOpNF46aBKsPoSiSQGa7MkabIwPupgMweOZOUkfkf-KTmd/exec';
const PAGES_PER_BATCH = 4;   // image pages sent to the AI per upload request
const TEXT_PAGES_PER_BATCH = 10;   // clean-text pages per request (no AI needed)
const PARALLEL_BATCHES = 2;          // batches processed at the same time (free limit: 15 requests/min)
const STAGGER_MS = 1500;             // small gap between starting batches
const WAIT_AFTER_RATE_LIMIT = 65000;  // ms

/* ================= TEXT (Khmer / English) ================= */
const T = {
  km:{

/* ================= NETWORK ================= */
function configured(){ return GAS_URL && GAS_URL.startsWith('https://'); }

async function post(body){
  if(!configured()) throw new Error(t('errCfg'));
  const rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  body = Object.assign({}, body, { rid });
  let r;
  try{
    r = await fetch(GAS_URL, { method:'POST', body: JSON.stringify(body), cache:'no-store' }); // text/plain: no preflight
  }catch(e){ throw new Error(t('errNet')); }
  const raw = await r.text();
  let j;
  try{ j = JSON.parse(raw); }
  catch(e){ throw new Error(t('errServer')); }   // Google returned an error web page (timeout / hiccup)
  if(j.rid !== undefined && j.rid !== rid) throw new Error('Mismatched server reply, retrying');   // reply belongs to another request
  if(!j.ok) throw new Error(j.error || 'Error');
  return j;
}

function jsonp(params){
  return new Promise((resolve, reject) => {
    if(!configured()) return reject(new Error(t('errCfg')));
    const cb = 'cb' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error(t('errNet'))); }, 30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); data.ok ? resolve(data) : reject(new Error(data.error)); };
    s.onerror = () => { cleanup(); reject(new Error(t('errNet'))); };
    s.src = GAS_URL + '?' + new URLSearchParams({ ...params, callback: cb });
    document.body.appendChild(s);
  });
}

function shortName(d){
  const part = String(d.name).match(/part\s*(\d+)/i);
  const dept = d.department && d.department !== 'Other' ? d.department
    : String(d.name).replace(/clinical practice guidelines? for|december|\d{4}|pdf|[-_]/gi, ' ').replace(/\s+/g, ' ').trim();
  return dept + (part ? ' ' + part[1] : '');
}
// One chip per specialty: all parts of a guideline (e.g. Medicine 1, 2, 3) are searched together
function specialty(d){
  return (d.department && d.department !== 'Other') ? d.department : shortName(d).replace(/\s+\d+$/, '');
}
function fillScope(){
  const cur = $('scope').value;
  const ready = docs.filter(d => d.status === 'ready');
  const groups = {};
  ready.forEach(d => { const k = specialty(d); (groups[k] = groups[k] || []).push(d); });
  const opts = Object.keys(groups).sort().map(k => ({ ids: groups[k].map(d => d.docId).join(','), label: k,
    title: groups[k].map(d => d.name).join('\n') }));
  $('scope').innerHTML = `<option value="">${esc(t('scopeAll'))}</option>` +
    opts.map(o => `<option value="${esc(o.ids)}">${esc(o.label)}</option>`).join('');
  $('scope').value = opts.some(o => o.ids === cur) ? cur : '';
  const val = $('scope').value;
  $('scopeChips').innerHTML = [{ ids:'', label:t('scopeAll') }].concat(opts)
    .map(c => `<button type="button" class="chip" data-id="${esc(c.ids)}" aria-pressed="${c.ids === val}" ${c.title ? `title="${esc(c.title)}"` : ''}>${esc(c.label)}</button>`).join('');
  $('scopeChips').querySelectorAll('.chip').forEach(b => b.onclick = () => { $('scope').value = b.dataset.id; fillScope(); });
}

function renderEmpty(){

    <h2>${esc(t('emptyTitle'))}</h2>
    <p>${esc(mode === 'check' ? t('emptyCheck') : t('emptyBody'))}</p>

  </div>`;
  $('thread').querySelectorAll('.examples button').forEach(b => b.onclick = () => { $('input').value = b.textContent; send(); });
}

function md(src){
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([\d,\s]+)\]/g, (m, g) => g.split(/[,\s]+/).filter(Boolean)
      .map(n => `<button type="button" class="cite" data-n="${n}">${n}</button>`).join(''));
  const lines = esc(src).split('\n');
  let html = '', list = null;
  const close = () => { if(list){ html += `</${list}>`; list = null; } };
  for(const raw of lines){
    const line = raw.trimEnd();
    let m;
    if(!line.trim()){ close(); continue; }
    if((m = line.match(/^#{1,4}\s+(.*)/))){ close(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if((m = line.match(/^\s*[-*•]\s+(.*)/))){ if(list !== 'ul'){ close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ if(list !== 'ol'){ close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    close(); html += `<p>${inline(line)}</p>`;
  }
  close();
  return html;
}

function scrollDown(){ const s = $('scroller'); s.scrollTop = s.scrollHeight; }

function addUser(text){
  if(!$('thread').querySelector('.msg')) $('thread').innerHTML = '';
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="bubble">${mode === 'check' ? `<span class="tag">${esc(t('planTag'))}</span>` : ''}${esc(text)}</div>`;
  $('thread').appendChild(d);
  scrollDown();
}

function addPending(){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = `<div class="answer pending"><span class="dots"><i></i><i></i><i></i></span>
    <span class="stage">${esc(t('thinking'))}…</span><span class="secs">0 s</span></div>`;
  $('thread').appendChild(d);
  scrollDown();
  const start = Date.now();
  d._start = start;
  d._timer = setInterval(() => {
    const sec = Math.floor((Date.now() - start) / 1000);
    const secs = d.querySelector('.secs'); if(!secs){ clearInterval(d._timer); return; }
    secs.textContent = sec + ' s';
    if(sec === 3) d.querySelector('.stage').textContent = t('writing');
  }, 1000);
  return d;
}

function srcName(name){
  const d = docs.find(x => x.name === name);
  return d ? shortName(d) + (d.edition ? ', ' + d.edition : '') : name;
}
function fillAnswer(el, r){
  const id = 'm' + (++msgSeq);
  const srcHtml = (r.sources || []).map(s => `
    <details class="src" id="${id}-s${s.n}">
      <summary><span class="tab">${s.n}</span><span class="doc" title="${esc(s.docName)}">${esc(srcName(s.docName))}</span><span class="pg">${esc(t('page'))} ${esc(s.page)}</span></summary>
      <div class="excerpt">${esc(s.excerpt)}</div>
    </details>`).join('');
  el.innerHTML = `<div class="answer">
    ${md(r.answer)}
    ${srcHtml ? `<div class="sources"><span>${esc(t('sources'))}</span>${srcHtml}</div>` : ''}
    <div class="actions">
      ${r.logId ? `<span>${esc(t('helpful'))}</span>
      <button type="button" data-fb="up" aria-pressed="false" aria-label="Helpful">👍</button>
      <button type="button" data-fb="down" aria-pressed="false" aria-label="Not helpful">👎</button>` : ''}
      <button type="button" data-copy>${esc(t('copy'))}</button>
      ${r._secs ? `<span class="meta">${esc(t('answeredIn'))} ${r._secs} s</span>` : ''}
    </div>
  </div>`;
  if(r.fallback){ const first = el.querySelector('.src'); if(first) first.open = true; }
  el.querySelectorAll('.cite').forEach(b => b.onclick = () => {
    const box = document.getElementById(`${id}-s${b.dataset.n}`);
    if(!box) return;
    box.open = true; box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
    box.scrollIntoView({ behavior:'smooth', block:'nearest' });
  });
  el.querySelectorAll('[data-fb]').forEach(b => b.onclick = async () => {
    const value = b.dataset.fb;
    const comment = value === 'down' ? (prompt(t('whyNot')) || '') : '';
    el.querySelectorAll('[data-fb]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    try{ await post({ action:'feedback', logId:r.logId, value, comment }); b.parentElement.firstElementChild.textContent = t('thanks'); }catch(e){}
  });
  el.querySelector('[data-copy]').onclick = async e => {
    const txt = r.answer + ((r.sources||[]).length ? '\n\n' + r.sources.map(s => `[${s.n}] ${s.docName}, ${t('page')} ${s.page}`).join('\n') : '');
    try{ await navigator.clipboard.writeText(txt); e.target.textContent = t('copied'); }catch(_){}
  };
}

/* ================= CHAT ================= */
async function send(){
  const text = $('input').value.trim();
  if(!text || busy) return;
  busy = true; $('sendBtn').disabled = true;
  $('input').value = ''; autosize();
  addUser(text);
  const el = addPending();
  try{
    const r = await post({ action:'ask', question:text, mode, docId:$('scope').value, history:history.slice(-4) });
    clearInterval(el._timer);
    r._secs = ((Date.now() - el._start) / 1000).toFixed(1);
    fillAnswer(el, r);
    history.push({ role:'user', text }, { role:'model', text:r.answer });
  }catch(e){
    clearInterval(el._timer);
    el.innerHTML = `<div class="answer err"><p>${esc(e.message)}</p></div>`;
  }
  busy = false; $('sendBtn').disabled = false;
  scrollDown();
}

function setMode(m){
  mode = m;
  $('mConsult').setAttribute('aria-pressed', m === 'consult');
  $('mCheck').setAttribute('aria-pressed', m === 'check');
  $('input').placeholder = m === 'check' ? t('phCheck') : t('phConsult');
  if(!$('thread').querySelector('.msg')) renderEmpty();
  $('input').focus();
}

function autosize(){ const a = $('input'); a.style.height = 'auto'; a.style.height = Math.min(a.scrollHeight, 180) + 'px'; }

let docsError = '';
async function loadDocs(){
  try{ const r = await post({ action:'docs' }); docs = r.docs || []; docsError = ''; }
  catch(e){ docs = []; docsError = e.message; }
  fillScope(); renderDocsTable();
}

  const on = !$('adminView').classList.contains('on');
  $('adminView').classList.toggle('on', on);
  $('chatView').style.display = on ? 'none' : 'flex';
  $('adminLabel').textContent = on ? t('chat') : t('admin');
  if(on && adminPw) login(adminPw, true);
}

async function login(pw, silent){
  try{
    await post({ action:'adminCheck', password:pw });
    adminPw = pw; try{ sessionStorage.setItem('cpg_pw', pw); }catch(e){}
    $('loginPanel').classList.add('hide'); $('adminBody').classList.remove('hide');
    loadDocs(); loadStats();
  }catch(e){ if(!silent) $('loginMsg').textContent = e.message; }
}

function plog(msg){ const l = $('upLog'); l.textContent += msg + '\n'; l.scrollTop = l.scrollHeight; }

async function renderPage(pdf, n){
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale:1 });
  const scale = Math.min(2.2, 1400 / base.width);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  return c.toDataURL('image/jpeg', 0.82).split(',')[1];
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
// Read a page's own text layer. Accept it only when it is clearly clean English
// (Khmer text layers are often garbled, so Khmer/mixed/scanned pages go to the AI).
const EN_COMMON = /\b(the|and|of|to|in|with|for|or|is|are|be|if|at|by|mg|kg|ml|iv|im|po|patients?|treatment|dose|daily|hours?|days?|weeks?|months?|years?|children|child|adults?|blood|mmhg|signs?|severe|mild|moderate|diagnosis|management|tablets?|injection|infusion|every|max|minutes?|age)\b/gi;

// Layout-aware text: rebuilds lines from word positions and separates table columns with " | "
async function pageText(pdf, n, raw){
  const page = await pdf.getPage(n);
  const tc = await page.getTextContent();
  const items = tc.items.filter(it => it.str && it.str.trim() && it.transform).map(it => ({
    s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0,
    h: Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 10
  }));
  if(!items.length) return raw ? '' : null;
  items.sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const lines = [];
  for(const it of items){
    const line = lines[lines.length - 1];
    if(line && Math.abs(line.y - it.y) <= Math.max(2, 0.5 * Math.min(line.h, it.h))) line.items.push(it);
    else lines.push({ y: it.y, h: it.h, items: [it] });
  }
  let text = '', prevY = null, prevH = 10, tableLines = 0;
  for(const line of lines){
    line.items.sort((a, b) => a.x - b.x);
    let str = '', prev = null;
    for(const it of line.items){
      if(prev){
        const gap = it.x - (prev.x + prev.w);
        const charW = Math.max(prev.w / Math.max(1, prev.s.length), it.w / Math.max(1, it.s.length)) || 5;
        if(gap > Math.max(12, 2.5 * charW)) str += ' | ';
        // a real word space is about a third of a character wide; smaller gaps are letter spacing
        else if(gap > Math.max(1, 0.3 * charW) && !/\s$/.test(str) && !/^\s/.test(it.s)) str += ' ';
      }
      str += it.s;
      prev = it;
    }
    str = str.replace(/[ \t]+/g, ' ').trim();
    if(!str) continue;
    if(str.includes(' | ')) tableLines++;
    if(prevY !== null && prevY - line.y > 1.8 * Math.max(prevH, line.h)) text += '\n';
    text += (text ? '\n' : '') + str;
    prevY = line.y; prevH = line.h;
  }
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  if(raw) return text;
  if(/[\u1780-\u17FF\u19E0-\u19FF]/.test(text)) return null;       // contains Khmer: needs the AI
  const words = text.split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  const common = (text.match(EN_COMMON) || []).length;
  const letters = (text.match(/[A-Za-z]/g) || []).length;
  const vowels = (text.match(/[aeiouyAEIOUY]/g) || []).length;
  const vowelOK = letters > 0 && vowels / letters > 0.25 && vowels / letters < 0.6;   // rejects garbled legacy-font text
  const wordlike = words.filter(w => /^[(\[]?([A-Za-z][A-Za-z'’\-]*|[A-Za-z]?\d+([.,/–\-:]\d+)*[A-Za-z%µ/]*|[<>≥≤=+–\-]+|\||•)[)\].,;:]?$/.test(w)).length / words.length;
  // ordinary English prose
  if(text.length >= 300 && common >= 8 && common / words.length >= 0.08 && vowelOK) return text;
  // tables: fewer common words, but clean words, numbers and units in columns
  if(tableLines >= 3 && text.length >= 150 && common >= 3 && wordlike >= 0.75 && vowelOK) return text;
  return null;                                                      // scanned, garbled or unclear: needs the AI
}

async function postRetry(body, tries = 5){
  for(let i = 0; i < tries; i++){
    try{ return await post(body); }
    catch(e){
      const msg = String(e.message);
      if(msg.startsWith('DAILY_QUOTA') || i === tries - 1 || stopFlag) throw e;
      const rate = msg.startsWith('RATE_LIMIT');
      plog(rate ? '  Waiting 1 minute (free per-minute limit)…' : '  retry: ' + msg);
      await sleep(rate ? WAIT_AFTER_RATE_LIMIT : 20000);
    }
  }
}

// Reads a list of pages and stores them: clean text pages directly, others by AI, 3 batches in parallel.
// Used by the upload and by "Check & re-read pages".
async function indexPageList(pdf, docId, name, pageNums, o){
  const log = o.log, st = { freePages:0, aiPages:0 };
  let idx = 0, fatal = null;
  const running = new Set();
  async function processBatch(pages, imgs){
    let r = null;
    for(let attempt = 0; attempt < 3; attempt++){
      const x = await postRetry({ action:'indexPages', password:adminPw, docId, docName:name, pages });
      const confirmed = (x.pagesDone || []).length + (x.blocked || []).length;
      if(confirmed >= pages.length){ r = x; break; }
      log(`  Pages ${pages[0].page}–${pages[pages.length-1].page} not confirmed by the server, retrying…`);
      await sleep(5000);
    }
    if(!r) throw new Error(`Pages ${pages[0].page}–${pages[pages.length-1].page} could not be confirmed. Resume to try again.`);
    const blocked = r.blocked || [];
    const unread = (r.unreadable || []).slice();
    if(blocked.length){
      const why = r.blockedReason === 'quota' ? 'page-reading quota used up, using the backup model (slower)'
                : r.blockedReason === 'empty' ? 'AI returned no text' : 'AI filter blocked them';
      log(`Pages ${pages[0].page}–${pages[pages.length-1].page}: ${why}; reading page(s) ${blocked.join(', ')} one by one…`);
      for(const n of blocked){
        if(stopFlag || fatal) return;
        const item = pages.find(x => x.page === n);
        const r1 = await postRetry({ action:'indexPages', password:adminPw, docId, docName:name, pages:[item], fallback:true });
        if(r1.unreadable && r1.unreadable.length) unread.push(...r1.unreadable);
        else log(`  Page ${n} stored (fallback)`);
      }
    } else {
      log(`Pages ${pages[0].page}–${pages[pages.length-1].page} stored (${r.chunks ?? 0} sections; ${imgs ? imgs + ' read by AI' : 'text only, no AI'}${r.pending ? '; search index later' : ''})`);
    }
    st.aiPages += imgs; st.freePages += pages.length - imgs;
    o.onProgress(pages.length);
    if(unread.length) log(`  ⚠️ Could not read page(s) ${unread.join(', ')}. Check them in the PDF.`);
  }
  while(idx < pageNums.length && !stopFlag && !fatal){
    const pages = [];
    let imgs = 0;
    while(idx < pageNums.length && imgs < PAGES_PER_BATCH && pages.length < TEXT_PAGES_PER_BATCH){
      const p = pageNums[idx++];
      const txt = await pageText(pdf, p);
      if(txt) pages.push({ page:p, text:txt });
      else { pages.push({ page:p, image: await renderPage(pdf, p), layer: (await pageText(pdf, p, true)).slice(0, 20000) }); imgs++; }
    }
    const task = processBatch(pages, imgs)
      .catch(e => { if(!fatal) fatal = e; })
      .finally(() => running.delete(task));
    running.add(task);
    if(running.size >= PARALLEL_BATCHES) await Promise.race(running);
    else await sleep(STAGGER_MS);
  }
  await Promise.all(running);
  if(fatal) throw fatal;
  return st;
}

let busyTask = '';
async function startUpload(){
  if(busyTask){ plog(`Please wait: ${busyTask} is running.`); return; }
  busyTask = 'an upload';
  try{ await startUploadInner(); } finally { busyTask = ''; }
}
async function startUploadInner(){
  const file = $('upFile').files[0];
  const name = $('upName').value.trim();
  if(!file || !name){ plog('Choose a PDF and enter a document name.'); return; }
  if(!window.pdfjsLib){ plog('PDF reader failed to load. Check the internet connection.'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  stopFlag = false;
  $('upStart').disabled = true; $('upStop').classList.remove('hide'); $('upLog').textContent = '';
  try{
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const total = pdf.numPages;
    plog(`${name}: ${total} pages`);
    const c = await post({ action:'createDoc', password:adminPw, name, department:$('upDept').value, edition:$('upEdition').value, pages:total });
    const done = new Set((await post({ action:'docPages', password:adminPw, docId:c.docId })).pages);
    if(c.resumed) plog(`Resuming: ${done.size} pages already stored`);
    const todo = [];
    for(let p = 1; p <= total; p++) if(!done.has(p)) todo.push(p);
    let count = done.size;
    $('upBar').style.width = (count / total * 100) + '%';
    const st = await indexPageList(pdf, c.docId, name, todo, {
      log: plog, onProgress: n => { count += n; $('upBar').style.width = (count / total * 100) + '%'; } });
    const freePages = st.freePages, aiPages = st.aiPages;
    if(stopFlag) plog('Paused. Choose the same file and name to continue.');
    plog(`This session: ${freePages} pages read directly (free), ${aiPages} pages read by AI.`);
    if(!stopFlag){
      const f = await post({ action:'finishDoc', password:adminPw, docId:c.docId, pages:total });
      plog(`Done. ${f.chunks} sections searchable.`);
    }
  }catch(e){
    plog('Stopped: ' + String(e.message).replace(/^(DAILY_QUOTA|RATE_LIMIT): /, '') + '\nChoose the same file and name to continue.');
  }
  $('upStart').disabled = false; $('upStop').classList.add('hide');
  loadDocs();
}

/* ================= CHECK & RE-READ PAGES ================= */
const METHOD_LABEL = { text:'PDF text (exact)', ai:'AI (Gemini)', gemma:'AI (backup model)', notes:'AI notes (reworded)',
  layer:'raw PDF text', figure:'figure page', unreadable:'not read', unknown:'earlier upload' };
let chk = { pdf:null, doc:null, flagged:[] };
function clog(msg){ const l = $('chkLog'); l.textContent += msg + '\n'; l.scrollTop = l.scrollHeight; }
const toks = s => new Set((String(s).toLowerCase().match(/[a-z]{3,}|\d+(?:[.,]\d+)?/g) || []));
function recall(a, b){ const A = toks(a), B = toks(b); if(!A.size) return 1; let k = 0; A.forEach(t => { if(B.has(t)) k++; }); return k / A.size; }

function fillChkDocs(){
  const sel = $('chkDoc'); if(!sel) return;
  const cur = sel.value;
  sel.innerHTML = docs.map(d => `<option value="${esc(d.docId)}">${esc(d.name)} (${esc(d.pages)} p.)</option>`).join('');
  if(docs.some(d => d.docId === cur)) sel.value = cur;
}

async function runCheck(){
  if(busyTask){ clog(`Please wait: ${busyTask} is running. Pause it first.`); return; }
  busyTask = 'the page check';
  try{ await runCheckInner(); } finally { busyTask = ''; }
}
async function runCheckInner(){
  const file = $('chkFile').files[0];
  const doc = docs.find(d => d.docId === $('chkDoc').value);
  $('chkLog').textContent = ''; $('chkBody').innerHTML = ''; $('chkReread').classList.add('hide');
  if(!doc || !file){ clog('Choose the guideline and its PDF file.'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  stopFlag = false;
  $('chkRun').disabled = true; $('chkStop').classList.remove('hide');
  try{
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    if(Number(doc.pages) && pdf.numPages !== Number(doc.pages)) clog(`⚠️ This PDF has ${pdf.numPages} pages but the guideline has ${doc.pages}. Make sure it is the same file.`);
    clog('Loading stored pages…');
    // load the stored pages in parts of 100 pages, retrying a part that fails
    const stored = {};
    let storedCount = 0;
    for(let from = 1; from <= pdf.numPages; from += 100){
      const to = Math.min(pdf.numPages, from + 99);
      let part = null, lastErr = '';
      for(let tries = 0; tries < 3 && !part; tries++){
        try{
          const r = await post({ action:'pageReport', password:adminPw, docId:doc.docId, fromPage:from, toPage:to });
          if(Array.isArray(r.pages)) part = r.pages;
          else lastErr = 'reply without page list: ' + JSON.stringify(r).slice(0, 200);
        }catch(e){ lastErr = e.message; }
        if(!part) await sleep(3000);
      }
      if(!part) throw new Error(`Could not load stored pages ${from}–${to} (${lastErr}). Make sure the latest Code.gs is deployed as a New version.`);
      part.forEach(p => { stored[p.page] = p; storedCount++; });
      clog(`Loaded stored pages ${from}–${to}`);
    }
    clog(`${storedCount} stored pages found. Comparing with the PDF…`);
    const flagged = []; let khmerAI = [], ok = 0;
    for(let n = 1; n <= pdf.numPages; n++){
      if(stopFlag){ clog('Stopped.'); break; }
      if(n % 20 === 0){ clog(`Checked ${n} / ${pdf.numPages} pages…`); $('chkBar').style.width = (n / pdf.numPages * 100) + '%'; }
      const raw = await pageText(pdf, n, true);
      const clean = await pageText(pdf, n);
      const sp = stored[n];
      const khmerPage = /[\u1780-\u17FF]/.test(raw) || !raw.trim();
      let issue = '', pre = false;
      if(!sp){ issue = 'missing — not stored'; pre = true; }
      else if(sp.method === 'unreadable'){ issue = 'not read'; pre = true; }
      else if(sp.method === 'figure' && raw.replace(/\s/g,'').length >= 100){ issue = 'marked as figure page, but the PDF has text on it'; pre = true; }
      else if(sp.method === 'layer'){ issue = 'stored from raw PDF text (may contain errors)'; pre = true; }
      else if(clean && sp.method !== 'text'){
        const rc = recall(clean, sp.text);
        if(rc < 0.7){ issue = `only ${Math.round(rc*100)}% of the PDF's words were stored`; pre = true; }
      }
      else if(!khmerPage && raw.length >= 200 && sp.method !== 'figure' && sp.text.length < 0.4 * raw.length){
        issue = 'much shorter than the text in the PDF'; pre = true;
      }
      if(!issue && sp && sp.method === 'notes') issue = 'reworded notes (AI copy filter) — check doses';
      if(!issue && sp && khmerPage && ['ai','gemma','notes','unknown'].includes(sp.method)) khmerAI.push(n);
      if(issue) flagged.push({ page:n, method: sp ? sp.method : '', issue, pre, text: sp ? sp.text : '' });
      else ok++;
    }
    $('chkBar').style.width = '100%';
    chk = { pdf, doc, flagged };
    clog(`Done: ${ok} pages look fine, ${flagged.length} flagged.`);
    if(khmerAI.length){
      const sample = khmerAI.filter((_, i) => i % Math.max(1, Math.floor(khmerAI.length / 10)) === 0).slice(0, 10);
      clog(`${khmerAI.length} Khmer / image pages were read by AI and cannot be compared automatically. Spot-check a few against the PDF, e.g. pages ${sample.join(', ')}.`);
    }
    $('chkBody').innerHTML = flagged.map((f, i) => `<tr>
      <td><input type="checkbox" data-i="${i}" ${f.pre ? 'checked' : ''}></td>
      <td>${f.page}</td><td>${esc(METHOD_LABEL[f.method] || f.method || '—')}</td><td>${esc(f.issue)}</td>
      <td><details><summary>view</summary><div style="white-space:pre-wrap;max-height:200px;overflow:auto;font-size:.8rem">${esc(f.text.slice(0, 3000) || '(nothing stored)')}</div></details></td></tr>`).join('')
      || `<tr><td colspan="5" style="color:var(--ok)">✅ No problems found.</td></tr>`;
    if(flagged.length) $('chkReread').classList.remove('hide');
  }catch(e){ clog('Error: ' + e.message); }
  $('chkRun').disabled = false; $('chkStop').classList.add('hide');
}

async function rereadSelected(){
  if(busyTask){ clog(`Please wait: ${busyTask} is running. Pause it first.`); return; }
  busyTask = 'a re-read';
  try{ await rereadInner(); } finally { busyTask = ''; }
}
async function rereadInner(){
  const pages = [...document.querySelectorAll('#chkBody input[type=checkbox]:checked')].map(x => chk.flagged[+x.dataset.i].page);
  if(!pages.length){ clog('Select at least one page.'); return; }
  stopFlag = false;
  $('chkReread').disabled = true; $('chkRun').disabled = true; $('chkStop').classList.remove('hide');
  clog(`Re-reading ${pages.length} page(s)…`);
  let n = 0;
  try{
    await indexPageList(chk.pdf, chk.doc.docId, chk.doc.name, pages, {
      log: clog, onProgress: k => { n += k; $('chkBar').style.width = (n / pages.length * 100) + '%'; } });
    if(!stopFlag) await post({ action:'finishDoc', password:adminPw, docId:chk.doc.docId, pages:chk.pdf.numPages });
    clog(stopFlag ? 'Stopped.' : 'Re-read finished. Run the check again to confirm.');
  }catch(e){ clog('Stopped: ' + String(e.message).replace(/^(DAILY_QUOTA|RATE_LIMIT): /, '')); }
  $('chkReread').disabled = false; $('chkRun').disabled = false; $('chkStop').classList.add('hide');
  loadDocs();
}
